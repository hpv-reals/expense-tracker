name: ExpenseTracker
options:
  bundleIdPrefix: com.hieppv
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  ExpenseTracker:
    type: application
    platform: iOS
    sources:
      - path: ExpenseTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hieppv.expensetracker
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Expense Tracker"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: NO
        ENABLE_PREVIEWS: YES
        # Physical-device signing — kept here so `xcodegen generate` no longer
        # disables signing. No DEVELOPMENT_TEAM/CODE_SIGN_IDENTITY hardcoded:
        # free "Personal Team" provisioning is tied to whichever Apple ID is
        # signed into Xcode on this machine, so pick the Team once from the
        # Signing & Capabilities dropdown after each regenerate.
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Automatic
